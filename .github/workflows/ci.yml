# Owner: A1. Ubuntu runs on every push to a PR and on main. macOS minutes cost 10x on a
# private repo, so the macOS job runs on main, and on PRs only once they're ready for
# review and touch the app, the contract or the iOS scripts. While a PR is a draft, prove
# iOS work locally with scripts/sim.sh (AGENTS.md).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  ubuntu:
    name: Ubuntu · server and database
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0

      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta

      # codegen.sh builds swift-openapi-generator from source the first time (about 4.5
      # minutes) and keeps it here.
      - name: Codegen tool cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/glow-codegen
          key: glow-codegen-${{ runner.os }}-${{ hashFiles('scripts/codegen.sh') }}
          restore-keys: glow-codegen-${{ runner.os }}-

      - name: Codegen is up to date
        run: |
          scripts/codegen.sh
          if ! git diff --exit-code --stat; then
            echo "::error::Generated files are stale. Run 'pnpm codegen' and commit the result."
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo "::error::Codegen created files that aren't committed: $untracked"
            exit 1
          fi

      - name: Server environment (local profile)
        run: scripts/env-setup.sh --force

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

      - name: Vitest
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: A missing variable stops the server with a clear message
        run: |
          set +e
          out="$(SUPABASE_SERVICE_ROLE_KEY= timeout 60 pnpm --filter server exec next start -p 3999 2>&1)"
          code=$?
          set -e
          echo "$out"
          [ "$code" -ne 0 ] || { echo "::error::The server started without SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          echo "$out" | grep -q "SUPABASE_SERVICE_ROLE_KEY  is missing" || { echo "::error::No clear message"; exit 1; }

      - name: Smoke test every endpoint
        run: |
          pnpm --filter server exec next start -p 3000 > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          scripts/smoke.sh
          GLOW_TOKEN="$(scripts/dev-token.sh)" scripts/smoke.sh

      - name: pgTAP
        run: supabase test db

      - name: Server log
        if: failure()
        run: cat /tmp/server.log || true

  changes:
    name: Does this need the macOS job?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.decide.outputs.ios }}
    steps:
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$DRAFT" = true ]; then
            echo "ios=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Draft PR, so the macOS job waits until it's ready for review. Prove iOS work locally with scripts/sim.sh."
            exit 0
          fi
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')"
          pattern='^(ios/|contracts/|scripts/sim\.sh$|scripts/codegen\.sh$|\.swiftlint\.yml$|\.swiftformat$|\.github/workflows/ci\.yml$)'
          if printf '%s\n' "$files" | grep -qE "$pattern"; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No changes to ios/, contracts/ or the iOS scripts, so the macOS job is skipped."
          fi

  macos:
    name: macOS · iOS build and tests
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      GLOW_CI: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Tools
        run: |
          brew install xcodegen swiftlint swiftformat jq || brew upgrade swiftformat
          xcodebuild -version
          xcodegen --version
          swiftlint version
          swiftformat --version

      - name: Swift package cache
        uses: actions/cache@v6
        with:
          path: ios/build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ios/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: SwiftFormat and SwiftLint
        run: scripts/sim.sh lint

      - name: xcodegen is deterministic and no .xcodeproj is in git
        run: scripts/sim.sh verify-project

      - name: Boot Glow A
        run: scripts/sim.sh setup A

      - name: Build
        run: scripts/sim.sh build

      - name: Unit and UI tests on Glow A
        run: scripts/sim.sh test

      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: |
            ios/build/results/*.xcresult
            ios/build/logs/*.log
          if-no-files-found: ignore
