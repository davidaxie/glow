# SwiftLint for the iOS app. Owner: A3. CI runs `swiftlint lint --strict` (scripts/sim.sh lint).
# SwiftFormat owns layout (indentation, wrapping, commas); SwiftLint owns everything else.

included:
  - ios
excluded:
  - ios/build
  - ios/Glow.xcodeproj
  - ios/Packages/GlowKit/.build
  - ios/Packages/GlowKit/Sources/APIClient/Generated
  - ios/fastlane

disabled_rules:
  - trailing_comma # SwiftFormat adds them
  - opening_brace # SwiftFormat wraps braces
  - todo # placeholders say who owns the work

opt_in_rules:
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - last_where
  - private_swiftui_state
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

line_length:
  warning: 140
  error: 200
  ignores_urls: true

identifier_name:
  min_length: 2
  excluded: [id, x, y, to]

type_name:
  min_length: 2
  max_length: 60

nesting:
  type_level: 2

custom_rules:
  # Privacy: print and NSLog can leak coordinates, names or tokens into device logs.
  no_print:
    name: 'No print'
    regex: '(^|[^\w.])(print|debugPrint|NSLog)\('
    excluded: '/Tests/|UITests/'
    message: 'Use os.Logger with privacy annotations (see AppCore Log).'
    severity: error
  # Design tokens (B6): feature modules use DesignSystem's colors and type, never their own.
  # DesignSystemTests/LintRuleTests checks what these catch and what they let through.
  glow_feature_colors:
    name: 'Feature modules use DesignSystem colors'
    regex: '(\b(Color|UIColor|CGColor)\s*(\.init)?\(|#colorLiteral|\bUIColor\.|\bColor\.(red|orange|yellow|green|mint|teal|cyan|blue|indigo|purple|pink|brown|white|gray|black|primary|secondary|accentColor)\b|\.(foregroundStyle|foregroundColor|background|tint|fill|stroke|strokeBorder|border|accentColor|listRowBackground|presentationBackground|shadow)\(\s*(color:\s*)?\.(red|orange|yellow|green|mint|teal|cyan|blue|indigo|purple|pink|brown|white|gray|black|primary|secondary|tertiary|quaternary)\b)'
    included: '/Sources/Feature[^/]+/.+\.swift$'
    excluded_match_kinds: [comment, doccomment, string, string_interpolation_anchor]
    message: 'Use a DesignSystem color (.glowTextPrimary, .glowAccent, GlowHue, GlowSwatch…). Ask B6 for a new token.'
    severity: error
  glow_feature_fonts:
    name: 'Feature modules use DesignSystem type'
    regex: '(\b(Font|UIFont)\s*\.\s*(system|custom)\s*\(|\bUIFont\b|\bFont\.(largeTitle|title|title2|title3|headline|subheadline|body|callout|footnote|caption|caption2)\b|\.font\(\s*\.(?!glow\()|\.(fontDesign|fontWidth)\()'
    included: '/Sources/Feature[^/]+/.+\.swift$'
    excluded_match_kinds: [comment, doccomment, string, string_interpolation_anchor]
    message: 'Use a DesignSystem text style: .glowFont(.body) or .font(.glow(.headline)). Ask B6 for a new one.'
    severity: error

reporter: xcode
