          schema: { $ref: "#/components/schemas/ReportStatus" }
      responses:
        "200":
          description: Reports, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReportList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/admin/reports/{id}/resolve:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: adminResolveReport
      tags: [admin]
      summary: Dismiss a report, remove the card, or ban the person
      x-owner: B7
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportResolution" }
      responses:
        "200":
          description: The resolved report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  # ------------------------------------------------------------------ web
  /.well-known/apple-app-site-association:
    get:
      operationId: getAppSiteAssociation
      tags: [web]
      summary: The file that lets QR links open the app
      description: Served as `application/json` with no redirect.
      x-owner: B2
      security: []
      responses:
        "200":
          description: The association file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppleAppSiteAssociation" }

  /r/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RoomSlug" }
      - name: t
        in: query
        required: false
        description: The QR token. The page never shows it or the room's location.
        schema: { $ref: "#/components/schemas/QrToken" }
    get:
      operationId: getRoomWebPage
      tags: [web]
      summary: Web page for people who don't have Glow yet, with the TestFlight link
      description: With Glow installed, this link opens the app instead (universal link).
      x-owner: B2
      security: []
      responses:
        "200":
          description: The page.
          content:
            text/html:
              schema: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The Supabase access token of the signed-in person.
    cronSecret:
      type: http
      scheme: bearer
      description: The CRON_SECRET, sent by Vercel Cron.

  parameters:
    RoomId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MatchId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CardId:
      name: cardId
      in: path
      required: true
      description: A card ID, which is the check-in ID. Never a user ID.
      schema: { type: string, format: uuid }
    PhotoId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  headers:
    RetryAfter:
      description: Seconds to wait before trying again.
      schema: { type: integer, minimum: 1 }
    CacheControlNoStore:
      description: Always `no-store`. Images are never cached.
      schema: { type: string, enum: [no-store] }

  responses:
    JpegImage:
      description: A JPEG with no metadata, never cached.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
      content:
        image/jpeg:
          schema: { type: string, contentMediaType: image/jpeg }
    BadRequest:
      description: The request doesn't match the contract (`bad_request`, with `issues`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: bad_request
              message: The body is not valid.
              issues:
                - { path: body.tags.topColor, code: invalid_value, message: Invalid option }
    PayloadTooLarge:
      description: The request body is too large (`payload_too_large`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: payload_too_large, message: That request is too large. }
    Unauthorized:
      description: Missing, expired or invalid token (`unauthorized`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: unauthorized, message: Sign in again. }
    NotFound:
      description: It doesn't exist, or the caller isn't allowed to see it (`not_found`, P11).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: not_found, message: Not found. }
    Conflict:
      description: |
        The caller's own state doesn't allow this right now: `onboarding_incomplete`,
        `room_not_live`, `tap_limit_reached`, `chat_not_open`, `last_photo`, `slug_taken`, or
        the generic `conflict`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: tap_limit_reached, message: No taps left today in this room. }
    Unprocessable:
      description: |
        Understood but refused: `under_18`, `not_in_room`, `location_inaccurate`,
        `location_required`, `join_ticket_invalid`, `photo_rejected` (with `reason`) or
        `message_rejected`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            notInRoom:
              value:
                error: { code: not_in_room, message: Outside the room's area. }
            photoRejected:
              value:
                error: { code: photo_rejected, message: A face is visible., reason: face_visible }
    RateLimited:
      description: Too many requests (`rate_limited`).
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: rate_limited, message: Slow down., retryAfterSeconds: 10 }
    Unavailable:
      description: A dependency is down; try again (`unavailable`, with `reason` such as `moderation`).
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: unavailable, message: Try again in a moment., reason: moderation }
    UnexpectedError:
      description: "Anything else: `internal` (500), `not_implemented` (501, endpoint stubs) or `unsupported_media_type` (415)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: not_implemented, message: Not implemented yet. }

  schemas:
    # ---------------------------------------------------------------- errors
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorBody" }
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message:
          type: string
          description: Plain words for logs and debugging. Apps show their own copy per code.
        reason:
          type: string
          description: |
            Extra detail for some codes. `photo_rejected`: face_visible, nudity, no_outfit,
            no_person, possibly_minor or unreadable. `unavailable`: moderation.
        issues:
          type: array
          maxItems: 20
          description: For `bad_request`. Field paths and rule names only, never the values sent.
          items: { $ref: "#/components/schemas/ErrorIssue" }
    ErrorIssue:
      type: object
      additionalProperties: false
      required: [path, code, message]
      properties:
        path: { type: string, example: body.tags.topColor }
        code: { type: string, example: invalid_value }
        message: { type: string }
    ErrorCode:
      type: string
      description: |
        400 bad_request · 401 unauthorized · 404 not_found (also for anything not allowed, P11) ·
        409 conflict, onboarding_incomplete, room_not_live, tap_limit_reached, chat_not_open,
        last_photo, slug_taken · 413 payload_too_large · 415 unsupported_media_type ·
        422 under_18, not_in_room, location_inaccurate, location_required, join_ticket_invalid,
        photo_rejected, message_rejected · 429 rate_limited · 500 internal ·
        501 not_implemented · 503 unavailable. There is never a 403.
      enum:
        - bad_request
        - unauthorized
        - not_found
        - conflict
        - onboarding_incomplete
        - room_not_live
        - tap_limit_reached
        - chat_not_open
        - last_photo
        - slug_taken
        - payload_too_large
        - unsupported_media_type
        - under_18
        - not_in_room
        - location_inaccurate
        - location_required
        - join_ticket_invalid
        - photo_rejected
        - message_rejected
        - rate_limited
        - internal
        - not_implemented
        - unavailable

    # ---------------------------------------------------------------- shared enums
    Gender:
      type: string
      enum: [woman, man, nonbinary]
    OnboardingStep:
      type: string
      description: Where onboarding resumes. Rooms open only at `complete`.
      enum: [profile, photos, notifications, complete]
    ModerationStatus:
      type: string
      enum: [pending, approved, held, rejected]
    TopColor:
      type: string
      enum: [black, white, gray, red, pink, orange, yellow, green, blue, purple]
    HairLength:
      type: string
      enum: [short, medium, long]
    HairColor:
      type: string
      enum: [black, brown, blonde, red, gray, dyed]
    CardExtra:
      type: string
      enum: [glasses, hat, beard, headphones, backpack]
    RoomStatus:
      type: string
      enum: [live, paused, ended]
    MatchStatus:
      type: string
      description: |
        choosing: the CHOICE_WINDOW is open. glowing: a glow is on. chatting: the chat is open.
        met: both tapped We met (the chat stays open). Ended matches are never returned.
      enum: [choosing, glowing, chatting, met]
    MatchChoice:
      type: string
      enum: [find, chat]
    GlowColor:
      type: string
      description: |
        Ember #FF6B2C, Rose #FF3D8B, Violet #8C5BFF, Sky #2F8CFF, Aqua #12D6C5, Lime #9BE52E,
        Sun #FFD23F, Pearl #F2F2F7. The design system owns the hex values.
      enum: [ember, rose, violet, sky, aqua, lime, sun, pearl]
    GlowStatus:
      type: string
      enum: [active, met, canceled, expired]
    ApnsEnvironment:
      type: string
      enum: [sandbox, production]
    ReportContext:
      type: string
      description: What the ID points at. A chat ID is its match ID.
      enum: [card, match, chat]
    ReportReason:
      type: string
      enum: [harassment, inappropriate_photo, underage, spam, unsafe, other]
    ReportStatus:
      type: string
      enum: [open, dismissed, actioned]
    CaptureKind:
      type: string
      enum: [screenshot, recording]
    RoomSlug:
      type: string
      pattern: "^[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?$"
      example: demo
    RoomCode:
      type: string
      description: 6 characters from ABCDEFGHJKLMNPQRSTUVWXYZ23456789. The server uppercases input.
      pattern: "^[A-HJ-NP-Za-hj-np-z2-9]{6}$"
      example: HACK26
    QrToken:
      type: string
      description: A rotating screen token (8 base32 characters) or a poster token (16).
      pattern: "^[A-Z2-7]{8}([A-Z2-7]{8})?$"
      example: DEMOSTATICTOKEN2
    SignedImage:
      type: object
      additionalProperties: false
      description: A short-lived image link. Fetch it with the bearer token, before `expiresAt`.
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri-reference
          description: Relative to the API base URL.
          example: /api/cards/aaaaaaaa-0000-4000-8000-000000000001/image?exp=1793040000&sig=Xb3fQ0x2lN4m3P1QeRrS5T6uV7wX8yZ9a0b1c2d3e4f
        expiresAt: { type: string, format: date-time }

    # ---------------------------------------------------------------- me
    Me:
      type: object
      additionalProperties: false
      required: [id, profile, photos, onboardingStep, isAdmin]
      properties:
        id:
          type: string
          format: uuid
          description: My own user ID (the only user ID the API ever returns).
        profile: { $ref: "#/components/schemas/MyProfile" }
        photos:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/MyPhoto" }
        onboardingStep: { $ref: "#/components/schemas/OnboardingStep" }
        isAdmin: { type: boolean }
      example:
        id: 7e570000-0000-4000-8000-000000000001
        profile: { firstName: Alex, birthdate: "1999-04-12", gender: woman, showMe: [man], paused: false, viewerCode: YTVFCREQ }
        photos:
          - { id: 0f0f0f0f-0000-4000-8000-000000000001, position: 0, moderationStatus: approved, url: /api/me/photos/0f0f0f0f-0000-4000-8000-000000000001 }
        onboardingStep: complete
        isAdmin: false
    MyProfile:
      type: object
      additionalProperties: false
      required: [showMe, paused, viewerCode]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 40 }
        birthdate: { type: string, format: date }
        gender: { $ref: "#/components/schemas/Gender" }
        showMe:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Gender" }
        paused: { type: boolean }
        viewerCode:
          type: string
          description: My code, printed in the watermark of every image I'm served.
          pattern: "^[A-HJ-NP-Z2-9]{8}$"
    MyPhoto:
      type: object
      additionalProperties: false
      required: [id, position, moderationStatus, url]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, minimum: 0, maximum: 2 }
        moderationStatus: { $ref: "#/components/schemas/ModerationStatus" }
        url:
          type: string
          format: uri-reference
          description: "`/api/me/photos/{id}`, fetched with the bearer token."
    ProfileUpdate:
      type: object
      additionalProperties: false
      required: [firstName, birthdate, gender, showMe]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 40 }
        birthdate: { type: string, format: date, description: "18 or older (MIN_AGE)." }
        gender: { $ref: "#/components/schemas/Gender" }
        showMe:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { $ref: "#/components/schemas/Gender" }
      example: { firstName: Alex, birthdate: "1999-04-12", gender: woman, showMe: [man] }
    NewProfilePhoto:
      type: object
      additionalProperties: false
      required: [position, photo]
      properties:
        position: { type: integer, minimum: 0, maximum: 2 }
        photo:
          type: string
          contentEncoding: base64
          contentMediaType: image/jpeg
          maxLength: 4000000
          description: Base64 JPEG, cropped to 4:5, metadata removed, at most PHOTO_MAX_BYTES before encoding.
    PauseRequest:
      type: object
      additionalProperties: false
      required: [paused]
      properties:
        paused: { type: boolean }
    PauseState:
      type: object
      additionalProperties: false
      required: [paused]
      properties:
        paused: { type: boolean }

    # ---------------------------------------------------------------- dev
    TestLoginRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          description: Only test addresses at glow.test.
          pattern: "^[a-z0-9._+-]+@glow\\.test$"
          example: alex@glow.test
    TestSession:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, expiresIn, userId]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Seconds. }
        userId: { type: string, format: uuid, description: The test person's own ID. }

    # ---------------------------------------------------------------- devices
    DeviceRegistration:
      type: object
      additionalProperties: false
      required: [apnsToken, environment]
      properties:
        apnsToken:
          type: string
          description: The APNs device token as lowercase hex.
          pattern: "^[0-9a-f]{64,200}$"
        environment: { $ref: "#/components/schemas/ApnsEnvironment" }
        appVersion: { type: string, maxLength: 32, example: "1.0 (42)" }
    Device:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string, format: uuid }

    # ---------------------------------------------------------------- rooms
    RoomAccess:
      description: How the person got to the room. A code, or a slug plus QR token from a link.
      oneOf:
        - $ref: "#/components/schemas/RoomAccessByCode"
        - $ref: "#/components/schemas/RoomAccessByLink"
      discriminator:
        propertyName: kind
        mapping:
          code: "#/components/schemas/RoomAccessByCode"
          link: "#/components/schemas/RoomAccessByLink"
    RoomAccessByCode:
      type: object
      additionalProperties: false
      required: [kind, code]
      properties:
        kind: { type: string, enum: [code] }
        code: { $ref: "#/components/schemas/RoomCode" }
    RoomAccessByLink:
      type: object
      additionalProperties: false
      required: [kind, slug, token]
      properties:
        kind: { type: string, enum: [link] }
        slug: { $ref: "#/components/schemas/RoomSlug" }
        token: { $ref: "#/components/schemas/QrToken" }
    RoomSummary:
      type: object
      additionalProperties: false
      description: What the app may know about a room. Never its location or secrets.
      required: [id, slug, name, status, startsAt, endsAt]
      properties:
        id: { type: string, format: uuid }
        slug: { $ref: "#/components/schemas/RoomSlug" }
        name: { type: string }
        status: { $ref: "#/components/schemas/RoomStatus" }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
      example:
        id: de000000-0000-4000-8000-000000000001
        slug: demo
        name: Glow demo room (test data)
        status: live
        startsAt: "2026-10-23T06:00:00.000Z"
        endsAt: "2026-11-22T06:00:00.000Z"
    LocationFix:
      type: object
      additionalProperties: false
      description: One fresh fix. Used for the check and then forgotten. Never stored or logged (P2).
      required: [latitude, longitude, accuracy]
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        accuracy:
          type: number
          format: double
          exclusiveMinimum: 0
          description: Horizontal accuracy in meters, as CoreLocation reports it.
    JoinRequest:
      type: object
      additionalProperties: false
      required: [access, location]
      properties:
        access: { $ref: "#/components/schemas/RoomAccess" }
        location: { $ref: "#/components/schemas/LocationFix" }
    JoinTicket:
      type: object
      additionalProperties: false
      required: [ticket, expiresAt]
      properties:
        ticket:
          type: string
          description: An opaque signed ticket for this person and room. Send it to check in.
        expiresAt: { type: string, format: date-time }
    CardTags:
      type: object
      additionalProperties: false
      required: [topColor, extras]
      properties:
        topColor: { $ref: "#/components/schemas/TopColor" }
        hairLength: { $ref: "#/components/schemas/HairLength" }
        hairColor: { $ref: "#/components/schemas/HairColor" }
        extras:
          type: array
          uniqueItems: true
          maxItems: 5
          items: { $ref: "#/components/schemas/CardExtra" }
      example: { topColor: green, hairLength: short, hairColor: brown, extras: [glasses, headphones] }
    CheckinRequest:
      type: object
      additionalProperties: false
      required: [ticket, photo, tags]
      properties:
        ticket: { type: string, description: From joinRoom. }
        photo:
          type: string
          contentEncoding: base64
          contentMediaType: image/jpeg
          maxLength: 4000000
          description: |
            Base64 JPEG of today's outfit with every face blurred on the phone, at most
            PHOTO_MAX_DIMENSION on the long side, quality PHOTO_JPEG_QUALITY, no metadata.
        tags: { $ref: "#/components/schemas/CardTags" }
    MyCheckin:
      type: object
      additionalProperties: false
      required: [cardId, roomId, tags, visible, joinedAt, expiresAt, image]
      properties:
        cardId: { type: string, format: uuid }
        roomId: { type: string, format: uuid }
        tags: { $ref: "#/components/schemas/CardTags" }
        visible: { type: boolean, description: False after an admin removes the card. }
        joinedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        image: { $ref: "#/components/schemas/SignedImage" }
    RoomState:
      type: object
      additionalProperties: false
      required: [room, tapsLeftToday, viewsLeftToday]
      properties:
        room: { $ref: "#/components/schemas/RoomSummary" }
        checkin: { $ref: "#/components/schemas/MyCheckin" }
        tapsLeftToday: { type: integer, minimum: 0 }
        viewsLeftToday: { type: integer, minimum: 0 }

    # ---------------------------------------------------------------- deck
    DeckFilters:
      type: object
      additionalProperties: false
      description: |
        What I noticed. Every field is optional, and an empty list means any. A card matches when
        each listed attribute is one of the listed values and it has every listed extra.
      properties:
        gender:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Gender" }
        topColor:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/TopColor" }
        hairLength:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/HairLength" }
        hairColor:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/HairColor" }
        extras:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/CardExtra" }
    DeckRequest:
      type: object
      additionalProperties: false
      properties:
        filters: { $ref: "#/components/schemas/DeckFilters" }
        offset:
          type: integer
          minimum: 0
          description: The `nextOffset` of the previous page. 0 by default.
      example: { filters: { gender: [woman], topColor: [green, blue], extras: [glasses] }, offset: 0 }
    DeckEmptyReason:
      type: string
      description: |
        Why a page has no cards. quiet: nobody else here fits me yet. no_match: nobody fits these
        filters. view_limit_reached: today's CARD_VIEWS_PER_ROOM_PER_DAY are used. paused: I'm
        paused. checkin_ended: my check-in expired, ended or was removed.
      enum: [quiet, no_match, view_limit_reached, paused, checkin_ended]
    Card:
      type: object
      additionalProperties: false
      description: A today's-look card. No face, name, distance or user ID (P1).
      required: [id, image, tags, tappedByMe]
      properties:
        id:
          type: string
          format: uuid
          description: The card ID (its check-in ID). Send it to tap.
        image: { $ref: "#/components/schemas/SignedImage" }
        tags: { $ref: "#/components/schemas/CardTags" }
        tappedByMe:
          type: boolean
          description: I already tapped this person in this room in the last TAP_TTL. Says nothing about them.
    Deck:
      type: object
      additionalProperties: false
      required: [cards, viewsLeftToday, hasMore]
      properties:
        cards:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/Card" }
        viewsLeftToday: { type: integer, minimum: 0 }
        hasMore: { type: boolean }
        nextOffset: { type: integer, minimum: 0, description: Present when hasMore is true. }
        emptyReason: { $ref: "#/components/schemas/DeckEmptyReason" }
      example:
        cards:
          - id: bbbbbbbb-0000-4000-8000-000000000001
            image: { url: /api/cards/bbbbbbbb-0000-4000-8000-000000000001/image?exp=1793040000&sig=Xb3fQ0x2lN4m3P1QeRrS5T6uV7wX8yZ9a0b1c2d3e4f, expiresAt: "2026-10-24T20:16:00.000Z" }
            tags: { topColor: green, hairLength: short, hairColor: brown, extras: [glasses] }
            tappedByMe: false
        viewsLeftToday: 49
        hasMore: false
    TapRequest:
      type: object
      additionalProperties: false
      required: [cardId]
      properties:
        cardId: { type: string, format: uuid }
    TapResult:
      type: object
      additionalProperties: false
      required: [result, tapsLeftToday]
      properties:
        result:
          type: string
          description: sent means saved and secret. It says nothing about the other person (P5).
          enum: [sent, mutual]
        tapsLeftToday: { type: integer, minimum: 0 }
        matchId: { type: string, format: uuid, description: Present when result is mutual. }

    # ---------------------------------------------------------------- matches
    MatchSummary:
      type: object
      additionalProperties: false
      required: [id, status, firstName, roomName, createdAt, choiceDeadline]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/MatchStatus" }
        firstName: { type: string, description: The other person's first name. Only ever after a match. }
        roomName: { type: string }
        createdAt: { type: string, format: date-time }
        choiceDeadline: { type: string, format: date-time }
        lastMessageAt: { type: string, format: date-time }
    MatchList:
      type: object
      additionalProperties: false
      required: [matches]
      properties:
        matches:
          type: array
          items: { $ref: "#/components/schemas/MatchSummary" }
    MatchDetail:
      type: object
      additionalProperties: false
      required: [id, status, firstName, photoCount, roomId, roomName, createdAt, choiceDeadline, otherHasChosen]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/MatchStatus" }
        firstName: { type: string, description: The other person's first name. }
        photoCount:
          type: integer
          minimum: 0
          maximum: 3
          description: How many of their photos `/api/matches/{id}/photos/{n}` serves.
        roomId: { type: string, format: uuid }
        roomName: { type: string }
        createdAt: { type: string, format: date-time }
        choiceDeadline: { type: string, format: date-time }
        yourChoice: { $ref: "#/components/schemas/MatchChoice" }
        otherHasChosen: { type: boolean }
        glow: { $ref: "#/components/schemas/Glow" }
      example:
        id: 64bfd966-bf7f-426a-b7aa-f0dc371bae1a
        status: choosing
        firstName: Blake
        photoCount: 2
        roomId: de000000-0000-4000-8000-000000000001
        roomName: Glow demo room (test data)
        createdAt: "2026-10-24T20:10:00.000Z"
        choiceDeadline: "2026-10-24T20:20:00.000Z"
        otherHasChosen: false
    ChoiceRequest:
      type: object
      additionalProperties: false
      required: [choice]
      properties:
        choice: { $ref: "#/components/schemas/MatchChoice" }
        location:
          $ref: "#/components/schemas/LocationFix"
          description: Required with find.
    ChoiceNext:
      type: string
      description: waiting for the other person, glow started, or chat opened.
      enum: [waiting, glow, chat]
    ChoiceReason:
      type: string
      enum: [other_undecided, other_location_stale, both_find, chose_chat, timeout, not_checked_in, already_decided]
    ChoiceResult:
      type: object
      additionalProperties: false
      required: [next, reason, match]
      properties:
        next: { $ref: "#/components/schemas/ChoiceNext" }
        reason: { $ref: "#/components/schemas/ChoiceReason" }
        match: { $ref: "#/components/schemas/MatchDetail" }

    # ---------------------------------------------------------------- glow
    MeetingSpot:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Water station }
    Glow:
      type: object
      additionalProperties: false
      required: [id, status, color, codeWord, startedAt, endsAt, youMet, theyMet]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/GlowStatus" }
        color: { $ref: "#/components/schemas/GlowColor" }
        codeWord:
          type: string
          pattern: "^[a-z]{2,16}$"
          description: Lowercase. Show it in capitals, in SF Pro Rounded.
        meetingSpot: { $ref: "#/components/schemas/MeetingSpot" }
        startedAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        youMet: { type: boolean }
        theyMet: { type: boolean }
      example:
        id: 453803c0-4199-465b-a12d-1981639daadd
        status: active
        color: aqua
        codeWord: maple
        meetingSpot: { id: de000000-0000-4000-8000-0000000005f3, name: Water station }
        startedAt: "2026-10-24T20:12:00.000Z"
        endsAt: "2026-10-24T20:27:00.000Z"
        youMet: false
        theyMet: false
    GlowCancelRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          enum: [cancel, switch_to_chat]

    # ---------------------------------------------------------------- chat
    Message:
      type: object
      additionalProperties: false
      required: [id, fromMe, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        fromMe: { type: boolean, description: Messages carry no sender ID. }
        body: { type: string, minLength: 1, maxLength: 1000 }
        createdAt: { type: string, format: date-time }
        clientId: { type: string, format: uuid, description: Echoed back on my own messages. }
    MessagePage:
      type: object
      additionalProperties: false
      required: [messages, hasMore]
      properties:
        messages:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/Message" }
        hasMore: { type: boolean }
        nextBefore:
          type: string
          format: date-time
          description: Present when hasMore. Send as `before` for older messages.
    NewMessage:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 1000 }
        clientId:
          type: string
          format: uuid
          description: Optional idempotency key. A retry with the same one returns the first message.

    # ---------------------------------------------------------------- safety
    BlockRequest:
      type: object
      additionalProperties: false
      required: [context, contextId]
      properties:
        context: { $ref: "#/components/schemas/ReportContext" }
        contextId:
          type: string
          format: uuid
          description: A card ID I was shown, or a match ID I'm in. Never a user ID.
    ReportRequest:
      type: object
      additionalProperties: false
      required: [context, contextId, reason]
      properties:
        context: { $ref: "#/components/schemas/ReportContext" }
        contextId: { type: string, format: uuid }
        reason: { $ref: "#/components/schemas/ReportReason" }
        details: { type: string, maxLength: 1000 }
    CaptureRequest:
      type: object
      additionalProperties: false
      required: [kind, roomId]
      properties:
        kind: { $ref: "#/components/schemas/CaptureKind" }
        roomId: { type: string, format: uuid }

    # ---------------------------------------------------------------- cron
    PurgeResult:
      type: object
      additionalProperties: false
      required: [checkinsDeleted, cardPhotosDeleted, tapsDeleted, glowsEnded, choicesTimedOut, expiringNotified]
      properties:
        checkinsDeleted: { type: integer, minimum: 0 }
        cardPhotosDeleted: { type: integer, minimum: 0 }
        tapsDeleted: { type: integer, minimum: 0 }
        glowsEnded: { type: integer, minimum: 0 }
        choicesTimedOut: { type: integer, minimum: 0 }
        expiringNotified: { type: integer, minimum: 0 }

    # ---------------------------------------------------------------- admin
    AdminMeetingSpot:
      type: object
      additionalProperties: false
      required: [id, name, sort]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60 }
        sort: { type: integer }
    AdminRoom:
      type: object
      additionalProperties: false
      required: [id, slug, name, code, latitude, longitude, radiusM, timezone, allowStaticQr, staticQrToken,
                 demoMode, status, startsAt, endsAt, spots, link]
      properties:
        id: { type: string, format: uuid }
        slug: { $ref: "#/components/schemas/RoomSlug" }
        name: { type: string }
        code: { $ref: "#/components/schemas/RoomCode" }
        latitude: { type: number, format: double, description: The venue's center (public). }
        longitude: { type: number, format: double }
        radiusM: { type: integer, minimum: 10, maximum: 5000 }
        timezone: { type: string, example: America/Los_Angeles }
        allowStaticQr: { type: boolean }
        staticQrToken: { $ref: "#/components/schemas/QrToken" }
        demoMode: { type: boolean }
        status: { $ref: "#/components/schemas/RoomStatus" }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        spots:
          type: array
          items: { $ref: "#/components/schemas/AdminMeetingSpot" }
        link:
          type: string
          format: uri
          description: The poster link, https://{DOMAIN}/r/{slug}?t={staticQrToken}.
    AdminRoomList:
      type: object
      additionalProperties: false
      required: [rooms]
      properties:
        rooms:
          type: array
          items: { $ref: "#/components/schemas/AdminRoom" }
    AdminRoomCreate:
      type: object
      additionalProperties: false
      required: [slug, name, latitude, longitude, startsAt, endsAt, spots]
      properties:
        slug: { $ref: "#/components/schemas/RoomSlug" }
        name: { type: string, minLength: 1, maxLength: 80 }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        radiusM: { type: integer, minimum: 10, maximum: 5000, description: ROOM_RADIUS_DEFAULT if left out. }
        timezone: { type: string, description: IANA name. America/Los_Angeles if left out. }
        allowStaticQr: { type: boolean }
        demoMode: { type: boolean }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        spots:
          type: array
          minItems: 3
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 60
    AdminRoomUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        radiusM: { type: integer, minimum: 10, maximum: 5000 }
        timezone: { type: string }
        allowStaticQr: { type: boolean }
        demoMode: { type: boolean }
        status: { $ref: "#/components/schemas/RoomStatus" }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    MeetingSpotsReplace:
      type: object
      additionalProperties: false
      required: [spots]
      properties:
        spots:
          type: array
          minItems: 3
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 60
    DisplayToken:
      type: object
      additionalProperties: false
      required: [token, url, windowEndsAt]
      properties:
        token: { $ref: "#/components/schemas/QrToken" }
        url: { type: string, format: uri, description: "https://{DOMAIN}/r/{slug}?t={token}" }
        windowEndsAt: { type: string, format: date-time }
    RoomMetrics:
      type: object
      additionalProperties: false
      required: [since, activeCheckins, checkins, cardViews, taps, matches, glowsStarted, glowsMet, reports]
      properties:
        since: { type: string, format: date-time }
        activeCheckins: { type: integer, minimum: 0 }
        checkins: { type: integer, minimum: 0 }
        cardViews: { type: integer, minimum: 0 }
        taps: { type: integer, minimum: 0 }
        matches: { type: integer, minimum: 0 }
        glowsStarted: { type: integer, minimum: 0 }
        glowsMet: { type: integer, minimum: 0 }
        reports: { type: integer, minimum: 0 }
    AdminCard:
      type: object
      additionalProperties: false
      required: [id, tags, visible, joinedAt, expiresAt, viewerCode]
      properties:
        id: { type: string, format: uuid }
        tags: { $ref: "#/components/schemas/CardTags" }
        visible: { type: boolean }
        joinedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        viewerCode: { type: string, description: "The card owner's watermark code, to match screenshots." }
    AdminCardList:
      type: object
      additionalProperties: false
      required: [cards]
      properties:
        cards:
          type: array
          items: { $ref: "#/components/schemas/AdminCard" }
    AdminRemoveCard:
      type: object
      additionalProperties: false
      required: [scope]
      properties:
        scope:
          type: string
          enum: [card, person]
    AdminReportEvidence:
      type: object
      additionalProperties: false
      required: [body, createdAt]
      properties:
        body: { type: string }
        createdAt: { type: string, format: date-time }
    AdminReport:
      type: object
      additionalProperties: false
      required: [id, context, contextId, reason, status, createdAt, reporterViewerCode, reportedViewerCode, evidence]
      properties:
        id: { type: string, format: uuid }
        context: { $ref: "#/components/schemas/ReportContext" }
        contextId: { type: string, format: uuid }
        reason: { $ref: "#/components/schemas/ReportReason" }
        details: { type: string }
        status: { $ref: "#/components/schemas/ReportStatus" }
        createdAt: { type: string, format: date-time }
        roomId: { type: string, format: uuid }
        reporterViewerCode: { type: string }
        reportedViewerCode: { type: string }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/AdminReportEvidence" }
    AdminReportList:
      type: object
      additionalProperties: false
      required: [reports]
      properties:
        reports:
          type: array
          items: { $ref: "#/components/schemas/AdminReport" }
    ReportResolution:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [dismiss, remove_card, ban]

    # ---------------------------------------------------------------- web
    AppleAppSiteAssociation:
      type: object
      required: [applinks]
      properties:
        applinks:
          type: object
          required: [details]
          properties:
            details:
              type: array
              items:
                type: object
                required: [appIDs, components]
                properties:
                  appIDs:
                    type: array
                    items: { type: string, example: TEAMID.com.example.glow }
                  components:
                    type: array
                    items:
                      type: object
                      properties:
                        "/": { type: string, example: "/r/*" }

    # ---------------------------------------------------------------- events (contracts/events.json)
    GlowEventType:
      type: string
      enum: [match.created, match.choice, match.ended, glow.started, glow.ended, message.created, checkin.expiring, deck.changed]
    GlowEvent:
      description: |
        Every Realtime broadcast payload and the custom keys of every push. Only the type plus a
        match or room ID: never a user ID, name, photo or message text (P1, P6).
      oneOf:
        - $ref: "#/components/schemas/MatchCreatedEvent"
        - $ref: "#/components/schemas/MatchChoiceEvent"
        - $ref: "#/components/schemas/MatchEndedEvent"
        - $ref: "#/components/schemas/GlowStartedEvent"
        - $ref: "#/components/schemas/GlowEndedEvent"
        - $ref: "#/components/schemas/MessageCreatedEvent"
        - $ref: "#/components/schemas/CheckinExpiringEvent"
        - $ref: "#/components/schemas/DeckChangedEvent"
      discriminator:
        propertyName: type
        mapping:
          match.created: "#/components/schemas/MatchCreatedEvent"
          match.choice: "#/components/schemas/MatchChoiceEvent"
          match.ended: "#/components/schemas/MatchEndedEvent"
          glow.started: "#/components/schemas/GlowStartedEvent"
          glow.ended: "#/components/schemas/GlowEndedEvent"
          message.created: "#/components/schemas/MessageCreatedEvent"
          checkin.expiring: "#/components/schemas/CheckinExpiringEvent"
          deck.changed: "#/components/schemas/DeckChangedEvent"
    MatchCreatedEvent:
      type: object
      additionalProperties: false
      required: [type, matchId]
      properties:
        type: { type: string, enum: [match.created] }
        matchId: { type: string, format: uuid }
    MatchChoiceEvent:
      type: object
      additionalProperties: false
      required: [type, matchId]
      properties:
        type: { type: string, enum: [match.choice] }
        matchId: { type: string, format: uuid }
    MatchEndedEvent:
      type: object
      additionalProperties: false
      required: [type, matchId]
      properties:
        type: { type: string, enum: [match.ended] }
        matchId: { type: string, format: uuid }
    GlowStartedEvent:
      type: object
      additionalProperties: false
      required: [type, matchId]
      properties:
        type: { type: string, enum: [glow.started] }
        matchId: { type: string, format: uuid }
    GlowEndedEvent:
      type: object
      additionalProperties: false
      required: [type, matchId]
      properties:
        type: { type: string, enum: [glow.ended] }
        matchId: { type: string, format: uuid }
    MessageCreatedEvent:
      type: object
      additionalProperties: false
      required: [type, matchId]
      properties:
        type: { type: string, enum: [message.created] }
        matchId: { type: string, format: uuid }
    CheckinExpiringEvent:
      type: object
      additionalProperties: false
      required: [type, roomId]
      properties:
        type: { type: string, enum: [checkin.expiring] }
        roomId: { type: string, format: uuid }
    DeckChangedEvent:
      type: object
      additionalProperties: false
      required: [type, roomId]
      properties:
        type: { type: string, enum: [deck.changed] }
        roomId: { type: string, format: uuid }
