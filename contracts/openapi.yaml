openapi: 3.1.0
info:
  title: Glow API
  version: 1.0.0
  summary: The single source of truth for the Glow API.
  description: |
    Glow lets two people in the same room find out, privately, that they noticed each other.

    Rules every endpoint follows (docs/SPEC.md and AGENTS.md):

    - **Sign in.** Every request sends the Supabase access token as `Authorization: Bearer <token>`,
      except where an operation says otherwise. A missing or bad token is 401.
    - **404, never 403 (P11).** Anything the caller isn't allowed to see answers 404 `not_found`,
      exactly as if it didn't exist.
    - **No one else's identity before a match (P1).** Before a mutual match, no response, event or
      push contains another person's user ID, name or face photo. Cards are identified by their
      card ID (the check-in ID). After a match, the other person is identified only by the match ID.
    - **One-sided taps stay secret (P5).** No response, count or event says whether someone tapped you.
    - **Times** are RFC 3339 in UTC with milliseconds, for example `2026-10-24T20:15:00.000Z`.
    - **IDs** are lowercase UUIDs.
    - **Numbers** like caps and time limits come from `contracts/constants.json`.
    - **Errors** are always `{ "error": { "code", "message" } }`. Apps choose their own words per `code`.
    - **Images** are never public links. Each image request is checked (P4) and served with
      `Cache-Control: no-store`.

    Generated from this file by `scripts/codegen.sh`: the Swift client
    (`ios/Packages/GlowKit/Sources/APIClient/Generated`) and TypeScript types plus zod schemas
    (`server/src/contracts`). The Swift client leaves out the `dev`, `cron`, `admin` and `web` tags.
servers:
  - url: http://localhost:3000
    description: Local server (Debug builds)
  - url: https://{domain}
    description: Production
    variables:
      domain:
        default: glow.example.com
        description: The app's web domain ({DOMAIN} in the spec).
security:
  - bearerAuth: []
tags:
  - name: me
    description: The signed-in person's own profile, photos and account.
  - name: dev
    description: Debug-only helpers for Simulator automation. Not in the Swift client.
  - name: devices
    description: Push token registration.
  - name: rooms
    description: Resolving, joining, checking in to and leaving rooms.
  - name: cards
    description: Card images.
  - name: deck
    description: The deck and secret taps.
  - name: matches
    description: Mutual matches, the reveal and the Find or Chat choice.
  - name: glow
    description: Glow mode.
  - name: chat
    description: Chat between matched people.
  - name: safety
    description: Blocks, reports and capture logging.
  - name: cron
    description: Scheduled jobs. Not in the Swift client.
  - name: admin
    description: Room operations for admins. Everyone else gets 404. Not in the Swift client.
  - name: web
    description: Web pages and files for universal links. Not in the Swift client.

paths:
  # ------------------------------------------------------------------ me
  /api/me:
    get:
      operationId: getMe
      tags: [me]
      summary: My profile, photos and onboarding step
      x-owner: B1
      responses:
        "200":
          description: The signed-in person.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/UnexpectedError" }
    delete:
      operationId: deleteAccount
      tags: [me]
      summary: Delete my account and all my data
      description: |
        Deletes every row, storage object and device token for this person, then the auth user.
        Any match they were in ends for the other person too (match.ended).
      x-owner: B8
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/me/profile:
    put:
      operationId: updateProfile
      tags: [me]
      summary: Save first name, birthday, gender and who I want to see
      description: People under 18 get 422 `under_18`, and nothing is stored (P10).
      x-owner: B1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200":
          description: The updated person.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/me/photos:
    post:
      operationId: addProfilePhoto
      tags: [me]
      summary: Add a profile photo (moderated)
      description: |
        Replaces any photo already at that position. The photo is moderated: rejected photos get
        422 `photo_rejected`; photos held for review come back with `moderationStatus: held`.
        Removing the last photo after onboarding is 409 `last_photo`.
        Profile photos are only ever shown to people with an active match (P1).
      x-owner: B1
      x-max-body-bytes: 4200000
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewProfilePhoto" }
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyPhoto" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/me/photos/{id}:
    parameters:
      - $ref: "#/components/parameters/PhotoId"
    get:
      operationId: getMyPhoto
      tags: [me]
      summary: One of my own profile photos
      x-owner: B1
      responses:
        "200": { $ref: "#/components/responses/JpegImage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }
    delete:
      operationId: deleteProfilePhoto
      tags: [me]
      summary: Remove one of my profile photos
      x-owner: B1
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/me/pause:
    post:
      operationId: setPaused
      tags: [me]
      summary: Pause or resume being visible
      description: Paused people leave every deck at once (P8), and deck.changed goes to their rooms.
      x-owner: B8
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PauseRequest" }
      responses:
        "200":
          description: The new state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PauseState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  # ------------------------------------------------------------------ dev
  /api/dev/test-login:
    post:
      operationId: testLogin
      tags: [dev]
      summary: Debug-only sign-in for Simulator tests
      description: |
        Signs in (creating if needed) a test person and returns a Supabase session. Only
        `@glow.test` emails are accepted, so this can never sign in a real account. Answers 404
        unless the server has `ALLOW_TEST_LOGIN` set, which is never set on Vercel. The app calls
        this only from Debug builds, with a hand-written request (it's not in the generated client).
      x-owner: B1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestLoginRequest" }
      responses:
        "200":
          description: A session for the test person.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  # ------------------------------------------------------------------ devices
  /api/devices:
    post:
      operationId: registerDevice
      tags: [devices]
      summary: Register a push token
      description: |
        Registering a token that already exists moves it to the signed-in person.
        Xcode builds send `sandbox`; TestFlight builds send `production`.
      x-owner: B5
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceRegistration" }
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/devices/{id}:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    delete:
      operationId: deleteDevice
      tags: [devices]
      summary: Remove a push token
      x-owner: B5
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  # ------------------------------------------------------------------ rooms
  /api/rooms/resolve:
    post:
      operationId: resolveRoom
      tags: [rooms]
      summary: Turn a room code, or a slug plus QR token, into a room
      description: |
        Returns the room's name and times. A wrong code or token is 404. This only gets someone to
        the location check: it never gets them into a room by itself. People who haven't finished
        onboarding get 409 `onboarding_incomplete`.
      x-owner: B2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomAccess" }
            examples:
              code:
                value: { kind: code, code: HACK26 }
              link:
                value: { kind: link, slug: demo, token: DEMOSTATICTOKEN2 }
      responses:
        "200":
          description: The room.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/rooms/{id}:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: getRoomState
      tags: [rooms]
      summary: The room, my check-in there, and what I have left today
      description: How the app restores the room home after a relaunch. Calls `get_room_state`.
      x-owner: B2
      responses:
        "200":
          description: The room and my state in it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/rooms/{id}/join:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      operationId: joinRoom
      tags: [rooms]
      summary: QR token or code plus one location fix returns a join ticket
      description: |
        Passes if the distance from the room's center, minus the smaller of the fix's accuracy and
        GEO_ACCURACY_CREDIT, is within the room's radius. Fixes less accurate than GEO_MAX_ACCURACY
        get 422 `location_inaccurate`; fixes outside get 422 `not_in_room`. Coordinates are never
        stored or logged (P2): only pass or fail and a rough accuracy bucket. In a demo mode room,
        admins skip the check, and each skip is logged.
      x-owner: B2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinRequest" }
      responses:
        "200":
          description: Passed. Use the ticket to check in within JOIN_TICKET_TTL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinTicket" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/rooms/{id}/leave:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      operationId: leaveRoom
      tags: [rooms]
      summary: End my check-in now and delete my card
      description: Also sends deck.changed to the room. Leaving a room I'm not in is a quiet 204.
      x-owner: B2
      responses:
        "204": { description: Left. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/rooms/{id}/checkin:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      operationId: createCheckin
      tags: [rooms]
      summary: Join ticket plus blurred photo plus tags creates my card
      description: |
        Only a face-blurred photo ever leaves the phone (P3). The server moderates it and fails
        closed: a visible face, nudity or no outfit gets 422 `photo_rejected` with a `reason`, and
        a moderation outage gets 503 `unavailable`. Any older check-in of mine in this
        room ends. Calls `create_checkin`.
      x-owner: B3
      x-max-body-bytes: 4200000
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckinRequest" }
      responses:
        "201":
          description: Checked in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyCheckin" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  # ------------------------------------------------------------------ cards
  /api/cards/{cardId}/image:
    parameters:
      - $ref: "#/components/parameters/CardId"
      - name: exp
        in: query
        required: true
        description: When the link expires, in Unix seconds. At most CARD_URL_TTL after it was made.
        schema: { type: integer, minimum: 0 }
      - name: sig
        in: query
        required: true
        description: |
          base64url HMAC-SHA256 (CARD_URL_SECRET) over `{cardId}.{viewerId}.{exp}`. The viewer comes
          from the bearer token, so the link carries no user ID and works only for that viewer.
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
    get:
      operationId: getCardImage
      tags: [cards]
      summary: A watermarked card photo, through a signed 60-second link
      description: |
        Use the `image.url` from a deck or check-in response as is. The server checks the
        signature, the expiry and `card_visible_to`, then serves the photo with a faint repeated
        watermark of the viewer's code and `Cache-Control: no-store`. Expired, reused-by-someone-else
        and not-visible links all get 404 (P4, P11).
      x-owner: B3
      responses:
        "200": { $ref: "#/components/responses/JpegImage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  # ------------------------------------------------------------------ deck
  /api/rooms/{id}/deck:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      operationId: getDeck
      tags: [deck]
      summary: Filters return up to DECK_PAGE_SIZE cards with signed image links
      description: |
        Calls `get_deck`, which applies every deck rule, the filters and the daily view cap, in an
        order that stays the same all day. Cards never carry a user ID (P1). 404 if I've never
        checked in to this room.
      x-owner: B4
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeckRequest" }
      responses:
        "200":
          description: A page of the deck.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deck" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/rooms/{id}/taps:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      operationId: createTap
      tags: [deck]
      summary: Secret tap. Returns sent or mutual and taps left today
      description: |
        Calls `record_tap`. The other person is never told about a one-sided tap (P5). A card
        that isn't in my deck right now is 404; no taps left today is 409 `tap_limit_reached`.
        Tapping the same card again doesn't use a tap. On mutual, both people get match.created.
      x-owner: B4
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TapRequest" }
      responses:
        "200":
          description: Tap saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TapResult" }
              examples:
                sent:
                  value: { result: sent, tapsLeftToday: 2 }
                mutual:
                  value: { result: mutual, tapsLeftToday: 1, matchId: 64bfd966-bf7f-426a-b7aa-f0dc371bae1a }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  # ------------------------------------------------------------------ matches
  /api/matches:
    get:
      operationId: listMatches
      tags: [matches]
      summary: My active and past matches
      description: |
        Newest first. Ended matches (unmatched or blocked) never appear. "Now" in the app is
        `choosing` and `glowing`; "Earlier" is `chatting` and `met`. Calls `list_matches`.
      x-owner: B4
      responses:
        "200":
          description: My matches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/matches/{id}:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    get:
      operationId: getMatch
      tags: [matches]
      summary: One match, with the other person's first name and photo count
      description: Applies any timeout first (choice window, glow time). Calls `get_match`.
      x-owner: C2
      responses:
        "200":
          description: The match.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/matches/{id}/photos/{n}:
    parameters:
      - $ref: "#/components/parameters/MatchId"
      - name: n
        in: path
        required: true
        description: 0-based index into the other person's approved photos, below `photoCount`.
        schema: { type: integer, minimum: 0, maximum: 2 }
    get:
      operationId: getMatchPhoto
      tags: [matches]
      summary: The other person's profile photo, for active matches only
      description: Calls `match_photo_path`. 404 for ended matches and out-of-range `n` (P1, P11).
      x-owner: B3
      responses:
        "200": { $ref: "#/components/responses/JpegImage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/matches/{id}/choice:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    post:
      operationId: setChoice
      tags: [matches]
      summary: Find (with a fresh location fix) or Chat
      description: |
        Find needs `location`; the server checks it like a join (422 `not_in_room` or
        `location_inaccurate` on failure) before calling `set_choice`. When both chose Find, both
        are still checked in and both passed a check in the last GEO_FRESHNESS_FOR_GLOW, the glow
        starts and `next` is `glow`. Anything else opens the chat. `next: waiting` with
        `reason: other_location_stale` means the other person's app is being asked (match.choice)
        to send Find again with a fresh fix. While waiting with Find, the app re-sends Find with a
        fresh fix whenever it gets match.choice.
      x-owner: C2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChoiceRequest" }
      responses:
        "200":
          description: What happens next.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChoiceResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/matches/{id}/unmatch:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    post:
      operationId: unmatch
      tags: [chat]
      summary: End the match for both people
      description: Deletes the thread for both. Both get match.ended. Calls `unmatch`.
      x-owner: C4
      responses:
        "204": { description: Ended. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  # ------------------------------------------------------------------ glow
  /api/matches/{id}/glow:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    get:
      operationId: getGlow
      tags: [glow]
      summary: The match's glow session
      description: |
        The active session, or the one that just ended (kept for GLOW_ENDED_RETENTION). 404 when
        there is none.
      x-owner: C3
      responses:
        "200":
          description: The glow.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Glow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/matches/{id}/glow/met:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    post:
      operationId: markGlowMet
      tags: [glow]
      summary: I tapped We met
      description: When both have, the glow ends as `met` and both get glow.ended. Calls `glow_met`.
      x-owner: C3
      responses:
        "200":
          description: The glow, from my side.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Glow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/matches/{id}/glow/cancel:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    post:
      operationId: cancelGlow
      tags: [glow]
      summary: Cancel the glow, or switch to chat
      description: Ends the glow for both (glow.ended) and opens the chat. Calls `cancel_glow`.
      x-owner: C3
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlowCancelRequest" }
      responses:
        "200":
          description: The ended glow.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Glow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  # ------------------------------------------------------------------ chat
  /api/matches/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    get:
      operationId: listMessages
      tags: [chat]
      summary: Read chat messages
      description: Oldest to newest within the page. Page back with `before`.
      x-owner: C4
      parameters:
        - name: before
          in: query
          required: false
          description: Only messages created before this time (the `nextBefore` of the previous page).
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          description: At most MESSAGES_PAGE_SIZE (the default).
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: A page of messages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/UnexpectedError" }
    post:
      operationId: sendMessage
      tags: [chat]
      summary: Send a chat message
      description: |
        At most MESSAGE_MAX_CHARS. Moderated with a MODERATION_TIMEOUT budget: flagged messages get
        422 `message_rejected`; on timeout the message goes through and is reviewed afterwards.
        The chat opens once choosing is over (409 `chat_not_open` before). Someone blocked or
        unmatched gets 404. The recipient gets message.created. Calls `send_message`.
      x-owner: C4
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewMessage" }
      responses:
        "201":
          description: Sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  # ------------------------------------------------------------------ safety
  /api/blocks:
    post:
      operationId: createBlock
      tags: [safety]
      summary: Block someone from a card, match or chat ID
      description: |
        The server works out the person; the app never sends a user ID. A block applies both ways,
        everywhere, within 5 seconds (P7), and ends any match and glow between the two. Calls
        `block_user`.
      x-owner: B8
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockRequest" }
      responses:
        "204": { description: Blocked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/reports:
    post:
      operationId: createReport
      tags: [safety]
      summary: Report someone (this also blocks them)
      description: Calls `create_report`.
      x-owner: B8
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportRequest" }
      responses:
        "204": { description: Reported and blocked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/abuse/capture:
    post:
      operationId: logCapture
      tags: [safety]
      summary: Log a screenshot or screen recording of the deck
      description: Repeated captures flag the account for review.
      x-owner: B8
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaptureRequest" }
      responses:
        "204": { description: Logged. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  # ------------------------------------------------------------------ cron
  /api/cron/purge:
    get:
      operationId: runPurge
      tags: [cron]
      summary: Expiry cleanup, protected by the cron secret
      description: |
        Runs every PURGE_INTERVAL. Calls `purge_expired`, deletes the returned card photos, and
        sends checkin.expiring, glow.ended and match.choice as needed.
      x-owner: B8
      security:
        - cronSecret: []
      responses:
        "200":
          description: What was cleaned up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurgeResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  # ------------------------------------------------------------------ admin
  /api/admin/rooms:
    get:
      operationId: adminListRooms
      tags: [admin]
      summary: All rooms
      x-owner: B7
      responses:
        "200":
          description: Rooms, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRoomList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }
    post:
      operationId: adminCreateRoom
      tags: [admin]
      summary: Create a room
      x-owner: B7
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRoomCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRoom" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/admin/rooms/{id}:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: adminGetRoom
      tags: [admin]
      summary: One room, with its meeting spots
      x-owner: B7
      responses:
        "200":
          description: The room.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRoom" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }
    patch:
      operationId: adminUpdateRoom
      tags: [admin]
      summary: Change a room (name, center, radius, times, status, demo mode, static QR)
      description: Pausing or ending a room sends deck.changed to it.
      x-owner: B7
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRoomUpdate" }
      responses:
        "200":
          description: The room.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRoom" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/admin/rooms/{id}/spots:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    put:
      operationId: adminReplaceSpots
      tags: [admin]
      summary: Replace the room's meeting spots (MEETING_SPOTS_MIN to MEETING_SPOTS_MAX)
      x-owner: B7
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeetingSpotsReplace" }
      responses:
        "200":
          description: The room.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRoom" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/admin/rooms/{id}/poster:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: adminRoomPoster
      tags: [admin]
      summary: Printable poster with the static QR code, room code and three steps
      x-owner: B7
      responses:
        "200":
          description: The poster.
          content:
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/admin/rooms/{id}/display-token:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: adminDisplayToken
      tags: [admin]
      summary: The current rotating QR token, for the display page
      x-owner: B7
      responses:
        "200":
          description: The token for the current QR_ROTATION window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisplayToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/admin/rooms/{id}/static-token:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      operationId: adminRotateStaticToken
      tags: [admin]
      summary: Replace the poster token (old posters stop working)
      x-owner: B7
      responses:
        "200":
          description: The room with its new token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRoom" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/admin/rooms/{id}/metrics:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: adminRoomMetrics
      tags: [admin]
      summary: Live counts for the room (from room_activity, no user IDs)
      x-owner: B7
      parameters:
        - name: since
          in: query
          required: false
          description: Count from this time. Defaults to the start of the room's current day.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomMetrics" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/admin/rooms/{id}/cards:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      operationId: adminListCards
      tags: [admin]
      summary: Cards in the room right now, for moderation
      x-owner: B7
      responses:
        "200":
          description: Cards, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCardList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/admin/cards/{cardId}/image:
    parameters:
      - $ref: "#/components/parameters/CardId"
    get:
      operationId: adminCardImage
      tags: [admin]
      summary: A card photo for review, watermarked with the admin's code
      x-owner: B7
      responses:
        "200": { $ref: "#/components/responses/JpegImage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/admin/cards/{cardId}/remove:
    parameters:
      - $ref: "#/components/parameters/CardId"
    post:
      operationId: adminRemoveCard
      tags: [admin]
      summary: Remove a card, or remove the person from the room
      description: |
        `card` hides the card and deletes its photo (they can check in again). `person` also ends
        their check-in. Either way the room gets deck.changed.
      x-owner: B7
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRemoveCard" }
      responses:
        "204": { description: Removed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/admin/reports:
    get:
      operationId: adminListReports
      tags: [admin]
      summary: The reports queue
      x-owner: B7
      parameters:
